name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DEVENT_DISPATCHER_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build --preset ${{ matrix.sanitizer }} --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --preset ${{ matrix.sanitizer }} --output-on-failure

  install-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and install library
        run: >-
          cmake -S . -B build/install -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/prefix
          -DEVENT_DISPATCHER_BUILD_TESTS=OFF
          -DEVENT_DISPATCHER_BUILD_EXAMPLES=OFF
      - run: cmake --build build/install --parallel 2
      - run: cmake --install build/install
      - name: Build external package consumer
        run: >-
          cmake -S tests/package_consumer -B build/consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/prefix
      - run: cmake --build build/consumer --parallel 2
      - run: ./build/consumer/event_dispatcher_package_consumer
